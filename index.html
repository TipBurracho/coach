  :root{
    color-scheme:light;
    /* raw design-system palette (FITNESS_APP_DESIGN_SYSTEM §3) — light-only, no dark variant */
    --field-drab:#2F4F2F; --tactical-green:#556B2F; --paper-sand:#D7C9A3; --paper-light:#E8E0CA;
    --charcoal:#1E1E1E; --graphite:#41413D; --fog:#A8AF8A; --dirt-brown:#8B6F47;
    --blood-orange:#C24B2A; --mission-yellow:#E0B04F; --recovery-blue:#8FA6B7; --success-green:#5F7D50;

    /* legacy token names remapped to field-manual roles — existing rules keep working */
    --bg:#D7C9A3;          /* field paper                                   */
    --panel:#EFE9D7;       /* card surface (opaque)                         */
    --panel-2:#E4DBC0;     /* inset paper: inputs, .goal, bar track         */
    --line:#C7B994;        /* hairline rule                                 */
    --line-strong:#9A8C68; /* emphasised / dashed map-style rule            */
    --ink:#1E1E1E;         /* charcoal body text                            */
    --muted:#41413D;       /* graphite printed labels + eyebrows            */
    --dim:#5E663F;         /* hint text (darkened fog — raw #A8AF8A fails AA)*/
    --accent:#2F4F2F;      /* field-drab: primary action, active nav, route */
    --accent-2:#8B6F47;    /* dirt-brown: secondary accent                  */
    /* status: saturated = rules/fills/icons; -ink = any status TEXT (AA on paper) */
    --good:#5F7D50; --good-ink:#3C5230;
    --warn:#E0B04F; --warn-ink:#7A5314;
    --bad:#C24B2A;  --bad-ink:#8F2E16;
    --recovery:#8FA6B7; --recovery-ink:#3E5261;

  }
  *{box-sizing:border-box}

  body.setup{padding-bottom:20px}

  .wrap{max-width:720px;margin:0 auto;padding:14px 14px 20px}
  header.app{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 6px;max-width:720px;margin:0 auto}

  .brandmark{width:26px;height:26px;border-radius:var(--radius-sm);background:var(--field-drab);display:grid;place-items:center;color:var(--paper-light);font-weight:800}

  /* stamped state marker — schedule / calendar states; no fill, rough-ruled edge */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border:1.5px solid var(--line-strong);border-radius:14px 5px 14px 5px/5px 14px 5px 14px;font-family:var(--mono);font-size:10px;font-weight:700;background:none;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

  button{font-family:inherit;cursor:pointer;border:2px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:20px 7px 20px 7px/7px 20px 7px 20px;padding:11px 16px;font-size:14px;font-weight:600}

  button:focus-visible,.seg button:focus-visible,.sev button:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--field-drab);outline-offset:2px}
  input,select,textarea{font-family:inherit;background:var(--panel-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:var(--radius-sm);padding:11px;font-size:16px;width:100%}

  #btnMenu{width:40px;height:40px;min-height:0;padding:0;display:grid;place-items:center;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:none}
  #btnMenu svg{width:20px;height:20px}

  nav.tabs button .ico{width:22px;height:22px;line-height:1}

  /* field observation — no accent bar; a small tactical diamond marks it */

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) rotate(-1.5deg);background:var(--panel);border:2px solid var(--line-strong);border-radius:18px 6px 20px 6px / 6px 20px 6px 18px;padding:9px 18px;font-size:16px;font-family:var(--hand);z-index:80;opacity:0;transition:opacity .16s ease;pointer-events:none;box-shadow:3px 3px 0 rgba(30,30,30,.2)}

  .calrow .detail{padding:2px 6px 14px}
  .calweeklbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);text-align:center;padding:9px 0 3px;border-top:1px dashed var(--line-strong);margin-top:3px}
  .menu{position:fixed;inset:0;z-index:70;background:rgba(30,30,30,.22);display:none}

  .menu .panel{position:absolute;top:56px;right:12px;background:var(--panel);border:2px solid var(--line-strong);border-radius:255px 12px 225px 12px/12px 225px 15px 255px;min-width:190px;box-shadow:4px 4px 0 rgba(30,30,30,.28)}
  .menu .panel button{display:flex;align-items:center;gap:10px;width:100%;border:none;border-radius:0;background:none;justify-content:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
  .menu .panel button:last-child{border-bottom:none}

  .fade{animation:f .12s ease} @keyframes f{from{opacity:0}to{opacity:1}}
  .exname{font-weight:700;font-size:16px;letter-spacing:.04em}
  /* symptom scale — words on a ruled baseline, chosen word underlined in ink */
  .sev{display:flex;gap:0;border-bottom:1.5px solid var(--line-strong)}

<body>
<header class="app">
  <div class="row" style="align-items:center;gap:9px">
    <span class="brandmark"></span>
    <div><h1>Coach</h1><div class="sub" id="hdrSub">loading…</div></div>
  </div>
  <button class="ghost sm" id="btnMenu" aria-label="Menu — Coach, Data, Backup"></button>
</header>
<main class="wrap" id="view"></main>
<nav class="tabs"><div class="inner" id="tabbar"></div></nav>
<div class="menu" id="menu"><div class="panel" id="menuPanel"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   COACH — local-first deterministic training engine.
   Implements coach-training-engine-spec.md (rev 2). No AI at runtime:
   Claude is reached via Export Brief -> chat -> Import Plan (spec §6).

   PRIVACY: this file ships with NO personal data. Your profile, goals,
   constraints and benchmarks are entered on first run and stored ONLY in
   your device's IndexedDB (plus whatever backups you export yourself).
   ========================================================================== */

/* ---------- IndexedDB key-value store ---------- */
const DB='coachdb', ST='kv';
function idb(){ return new Promise((res,rej)=>{
  let done=false; const finish=fn=>(...a)=>{ if(done) return; done=true; clearTimeout(to); fn(...a); };
  const ok=finish(res), fail=finish(rej);
  const to=setTimeout(()=>fail(new Error('Storage timed out — close any other open tabs of this app and try again.')),5000);
  let r; try{ r=indexedDB.open(DB,1); }catch(e){ return fail(e); }
  r.onupgradeneeded=()=>r.result.createObjectStore(ST);
  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>fail(r.error||new Error('Storage unavailable'));
  r.onblocked=()=>fail(new Error('Storage is busy — close any other open tabs of this app and try again.')); }); }
async function kvGet(k){ const d=await idb(); return new Promise((res,rej)=>{
  const q=d.transaction(ST,'readonly').objectStore(ST).get(k);
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function kvSet(k,v){ const d=await idb(); return new Promise((res,rej)=>{
  const q=d.transaction(ST,'readwrite').objectStore(ST).put(v,k);
  q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
async function kvDel(k){ const d=await idb(); return new Promise((res,rej)=>{
  const q=d.transaction(ST,'readwrite').objectStore(ST).delete(k);
  q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }

/* ---------- helpers ---------- */
const nowISO=()=>new Date().toISOString();
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const round=(x,s)=>s?Math.round(x/s)*s:x;
const fmt=(n,d=1)=>(n==null||isNaN(n))?'—':(+n).toFixed(d).replace(/\.0$/,'');
const daysBetween=(a,b)=>Math.abs(new Date(a)-new Date(b))/864e5;
const dshort=iso=>new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const DOW=['sun','mon','tue','wed','thu','fri','sat'];
/* date-string arithmetic on YYYY-MM-DD (UTC-anchored, like the rest of the app) */
const dayKey=iso=>String(iso).slice(0,10);
function addDays(iso,n){ const d=new Date(dayKey(iso)+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const dowOf=iso=>DOW[new Date(dayKey(iso)+'T00:00:00Z').getUTCDay()];
function dlabel(iso){ return new Date(dayKey(iso)+'T00:00:00Z').toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'}).toUpperCase()+' '+dayKey(iso).slice(5); }
/* Benchmark battery (spec §5.8) — FIXED FOREVER, never rotates, tested 8-weekly.
   Vertical push is deliberately absent: pressing near-maximal overhead is the
   easiest way to arch, and that's the one risk not worth a number (L1b). */
const BENCHMARKS=[
  {id:'trap_bar_dl',  reps:5},
  {id:'front_squat',  reps:5},
  {id:'chest_press',  reps:5},
  {id:'cs_row',       reps:6},
  {id:'lat_pulldown', reps:6},
  {id:'farmer_carry', reps:30}    // capacity: load x distance, not e1RM
];

/* Programmed field tests, auto every 4 weeks (deload week of each block):
   Cooper replaces the Tue run, 5k time-trial replaces the Sun run.
   Every 8 weeks a strength test also replaces Gym B on the Wed. */
function testForDate(iso){
  const start=dayKey((S.meta&&S.meta.program_start)||(S.meta&&S.meta.created_at)||today());
  if(dayKey(iso)<start) return null;
  const weekIdx=Math.floor(daysBetween(start,iso)/7);
  if(weekIdx%4!==3) return null;                    // 4th week of each 4-week block
  const dow=dowOf(iso);
  if(dow==='tue') return {id:'test_cooper', modality:'test_cooper', name:'Cooper test'};
  if(dow==='sun') return {id:'test_5k',     modality:'test_5k',     name:'5k time-trial'};
  if(dow==='wed' && weekIdx%8===7) return {id:'strength_test', name:'Strength test', strength:true};
  return null;
}
function nextTestDate(testId){
  const t=today();
  for(let i=0;i<70;i++){ const d=addDays(t,i); const tf=testForDate(d);
    if(tf && (!testId||tf.id===testId)) return {date:d, test:tf}; }
  return null;
}
function planForDate(iso){
  const tf=testForDate(iso);
  if(tf && tf.strength) return {id:'day_strength_test', dow:dowOf(iso), kind:'gym', label:tf.name, strengthTest:tf,
    slots:BENCHMARKS.filter(b=>b.test!==false).map((b,i)=>({id:'bm'+i, exercise_id:b.id, sets:1, reps:[b.reps,b.reps], rpe:8, rest:180, role:'fixed'}))};
  if(tf) return {id:'day_'+tf.id, dow:dowOf(iso), kind:'run', modality:tf.modality, label:tf.name, test:tf};
  return S.program.days.find(d=>d.dow===dowOf(iso))||null;
}

/* ---------- Exercise rotation (spec §5.7) ----------
   Deterministic hash — NEVER Math.random(), or the exercise would change while
   he's mid-set. Accessories re-roll weekly, main lifts per 4-week block, and
   `fixed` (the benchmark battery) never rotates at all. */
function hash32(str){ let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
const weekIndexOf=iso=>Math.floor(daysBetween(dayKey((S.meta&&S.meta.program_start)||today()), iso)/7);
function slotExercise(slot, iso){
  const base=slot.exercise_id;
  const role=slot.role||'fixed';
  if(role==='fixed' || !base) return base;
  const exr=ex(base); if(!exr) return base;
  const pool=S.exercises.filter(e=>e.pattern===exr.pattern);
  if(pool.length<2) return base;
  const wk=weekIndexOf(iso||today());
  const period = role==='accessory' ? wk : Math.floor(wk/4);   // weekly vs per-block
  if(period<=0) return base;   // first week/block runs exactly as programmed, so the seeded benchmarks apply
  return pool[hash32(slot.id+'|'+role+'|'+period) % pool.length].id;
}
const sessOn=(iso,kind)=>S.sessions.find(s=>s.kind===kind && dayKey(s.date)===dayKey(iso));
function dayFlareOn(iso){ const c=sessOn(iso,'check'); return c ? (c.symptoms||[]).some(x=>x.severity>=2) : false; }
const val=id=>{ const e=document.getElementById(id); return e? e.value : ''; };
const num=id=>{ const v=parseFloat(val(id)); return isNaN(v)? null : v; };

/* ---------- untrusted-input hardening ----------
   Plans and backups are pasted/loaded from outside the app. Everything that
   comes in gets parsed with prototype keys dropped, then shape-checked and
   bounded. Rendering escapes on top of this (defence in depth).            */
const PROTO_KEYS=['__proto__','constructor','prototype'];
const dropProto=(k,v)=> PROTO_KEYS.includes(k) ? undefined : v;
const parseUntrusted=t=>JSON.parse(t,dropProto);
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
const sStr=(v,max)=> typeof v==='string' ? v.slice(0,max||300) : '';
function sInt(v,min,max,dflt){ const n=Number(v); return Number.isFinite(n)? clamp(Math.round(n),min,max) : dflt; }
function sNum(v,min,max,dflt){ const n=Number(v); return Number.isFinite(n)? clamp(n,min,max) : dflt; }

/* ---------- RPE -> %1RM  (reps-to-failure n = reps + (10 - RPE)) ---------- */
const PCT={1:100,2:95.5,3:92.2,4:89.2,5:86.3,6:83.7,7:81.1,8:78.6,9:76.2,10:74.4,11:72.3,12:70.3,13:68,14:66,15:65};
function pct(n){ if(n<=1)return 100; if(n>=15)return 65-(n-15)*1.5;
  const lo=Math.floor(n),hi=Math.ceil(n); return PCT[lo]+(PCT[hi]-PCT[lo])*(n-lo); }
const e1rmOf=(load,reps,rpe)=> (!load||!reps||!rpe)?0: load/(pct(reps+clamp(10-rpe,0,10))/100);
const loadFor=(e1,reps,rpe,step)=> round(e1*(pct(reps+clamp(10-rpe,0,10))/100), step);

/* ================= DERIVED — recomputed from the log, never authored ================= */
function derive(){
  const sess=[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date));
  const per={}, now=Date.now();
  let run7=0, run28=0;

  for(const s of sess){
    const age=(now-new Date(s.date))/864e5;
    if(s.kind==='gym'){
      const best={};
      for(const st of (s.sets||[])){
        const a=st.actual;
        /* only weight x reps sets are strength-tracked — a carry or a timed hold is not.
           Legacy sets have no `log`; fall back to the CURRENT library's type so old
           wall-sits/carries logged as weighted lifts don't pollute the strength stats. */
        const exr=ex(st.exercise_id);
        if(!exr) continue;                               // removed exercise — history only, not strength-tracked
        const lt = st.log || exr.log || 'weight_reps';
        if(lt!=='weight_reps') continue;                 // carries/holds are not strength-tracked
        const d=per[st.exercise_id]||(per[st.exercise_id]={e1:0,hist:[],_drift:[],trend:'—',chg:0,rpe_drift:0});
        if(a.load_kg && a.reps && a.rpe){
          const e=e1rmOf(a.load_kg,a.reps,a.rpe);
          if(!best[st.exercise_id] || e>best[st.exercise_id]) best[st.exercise_id]=e;
          if(st.prescribed && st.prescribed.rpe!=null) d._drift.push({age, v:a.rpe-st.prescribed.rpe});
        }
      }
      for(const id in best) per[id].hist.push({date:s.date.slice(0,10), v:+best[id].toFixed(1)});
    }
    if(s.kind==='run'){
      const m=s.duration_min||0;
      if(age<=7)  run7+=m;
      if(age<=28) run28+=m;
    }
  }

  for(const id in per){
    const d=per[id];
    d.e1 = d.hist.length ? d.hist[d.hist.length-1].v : (S.meta.seed_e1rm[id]||0);
    const rec=d._drift.filter(x=>x.age<=21).map(x=>x.v);
    d.rpe_drift = rec.length ? +(rec.reduce((a,b)=>a+b,0)/rec.length).toFixed(2) : 0;
    const t=d.hist.slice(-4);
    if(t.length>=2){ d.chg=+(t[t.length-1].v-t[0].v).toFixed(1);
      d.trend = d.chg>0.75?'progressing' : d.chg<-0.75?'regressing' : 'stalling'; }
    else d.trend = d.hist.length?'baseline':'seed';
    delete d._drift;
  }
  for(const id in (S.meta.seed_e1rm||{}))
    if(S.meta.seed_e1rm[id] && !per[id]) per[id]={e1:S.meta.seed_e1rm[id],hist:[],rpe_drift:0,trend:'seed',chg:0};

  /* symptom flares from morning checks — last 14 days */
  const flares=[];
  for(const s of sess){
    if(s.kind!=='check') continue;
    const age=(now-new Date(s.date))/864e5; if(age>14) continue;
    for(const sy of (s.symptoms||[])) if(sy.severity>=2)
      flares.push({date:s.date.slice(0,10), area:sy.area, severity:sy.severity, age});
  }
  const flareAreas=[...new Set(flares.map(f=>f.area))];

  const bws=sess.filter(s=>s.kind==='check'&&s.bodyweight_kg);
  const bw = bws.length? bws[bws.length-1].bodyweight_kg : null;

  /* impact ladder — replayed from the log (§5.4) */
  const L={...S.meta.ladder};
  for(const r of sess.filter(s=>s.kind==='run'&&s.modality==='run_walk')){
    const after=sess.filter(c=>c.kind==='check' && new Date(c.date)>new Date(r.date) && daysBetween(c.date,r.date)<=2);
    let worst=0;
    for(const c of after) for(const sy of (c.symptoms||[]))
      if(['knee','ankle','back'].includes(sy.area)) worst=Math.max(worst, sy.severity);
    if(worst>=2)       L.jog=Math.max(2, +(L.jog-1).toFixed(1));      // REGRESS
    else if(worst===1) { /* HOLD */ }
    else               L.jog=Math.min(30, round(L.jog*1.1, 0.5));     // PROGRESS
  }

  /* Flags carry both a human title/detail (Goals screen) and a concise technical
     `t` string (the Claude brief keeps using `t`). */
  const flags=[];
  for(const id in per){
    const d=per[id]; if(!ex(id)) continue;
    const nm=ex(id).name;
    if(d.rpe_drift>=1.0) flags.push({sev:d.rpe_drift>=1.3?'act':'watch',
      title:nm+' is feeling harder than it should',
      detail:'Recent sets came in above target effort — usually a fatigue sign. I’ve eased the load; watch your sleep and stress.',
      t:nm+': RPE drift +'+fmt(d.rpe_drift)+' — ease intensity'});
    else if(d.trend==='regressing') flags.push({sev:'watch',
      title:nm+' has dipped a little',
      detail:'Strength’s down slightly week-on-week — often just a rough patch. Hold steady, it tends to bounce back.',
      t:nm+': e1RM down '+fmt(-d.chg)+' kg'});
  }
  for(const a of flareAreas){
    const n=flares.filter(f=>f.area===a).length;
    flags.push({sev:n>=2?'act':'watch',
      title:'Your '+a+'’s been complaining',
      detail:'Flagged '+n+'× in two weeks, so I’ve eased your running and swapped '+a+'-heavy lifts to protect it. Clears after 7 days symptom-free.',
      t:a+' flare ×'+n+' in 14d — impact gated, exercises auto-swapped'});
  }

  /* Discipline/goal-stagnation flags — deliberately blunt (infantry-readiness
     stakes, not just fitness). Tissue/pain flags above stay calm on purpose:
     a hard tone has no business discouraging backing off a real injury
     signal. These three read the log for what gym-adherence alone can't show. */
  const runsSess=sess.filter(s=>s.kind==='run');
  const lastRun=runsSess.length?runsSess[runsSess.length-1]:null;
  const runGapDays=lastRun?(now-new Date(lastRun.date))/864e5:null;
  let runDormancyFired=false;
  if(runGapDays!=null && runGapDays>=14){
    runDormancyFired=true;
    const gd=Math.floor(runGapDays);
    flags.push({sev:runGapDays>=24?'act':'watch',
      title:gd+' days since your last run',
      detail:'Gym keeps happening — running doesn’t. That’s the piece that makes you infantry-ready instead of just gym-strong. Nobody checks your front squat before a patrol.',
      t:gd+'d since last run — aerobic/impact base not building despite gym adherence'});
  }
  for(const tst of TESTS){
    const last=lastTest(tst.modality);
    const overdue = last ? daysBetween(now,last.date)>(tst.every+4)
                         : daysBetween(now,S.meta.program_start)>=tst.every;
    if(overdue){
      const gd=last?Math.floor(daysBetween(now,last.date)):null;
      flags.push({sev:'watch',
        title:tst.name+(last?' — '+gd+'d since last test':' never tested'),
        detail: last
          ? 'You proved you could hit it '+gd+' days ago. Right now you don’t know if you still can — and the only way to find out is the retest you keep not doing.'
          : 'This is a real standard, not a nice-to-have — and it’s never been run once.',
        t:tst.name+' overdue ('+(last?gd+'d since last':'never done')+', cadence '+tst.every+'d)'});
    }
  }
  const bwChecks=sess.filter(s=>s.kind==='check'&&s.bodyweight_kg!=null);
  const g3=goal('g3');
  if(g3 && bwChecks.length>=2){
    const latest=bwChecks[bwChecks.length-1];
    const old=[...bwChecks].reverse().find(c=>(new Date(latest.date)-new Date(c.date))/864e5>=21);
    if(old){
      const delta=+(latest.bodyweight_kg-old.bodyweight_kg).toFixed(1);
      const dir=g3.dir||'down';
      const stalled = dir==='down' ? delta>-1 : delta<1;
      if(stalled) flags.push({sev:'watch',
        title:fmt(latest.bodyweight_kg)+' kg — basically where you were '+Math.round((new Date(latest.date)-new Date(old.date))/864e5)+' days ago',
        detail:'Nothing physical is stopping this one — no tissue excuse, no gate. Every kilo you’re not losing is a kilo your knees and lungs carry under a rucksack.',
        t:'Bodyweight stalled: '+(delta>0?'+':'')+delta+' kg over '+Math.round((new Date(latest.date)-new Date(old.date))/864e5)+'d vs target '+fmt(g3.target)+' kg'});
    }
  }

  /* missed-pattern: scheduled training days in the past 14d (>= install) with no
     matching session. A single miss is noise; a PATTERN is a planning signal —
     flag it toward re-planning, never toward cramming (tissue-first). Skipped
     for runs when the dormancy flag above already fired — same underlying
     problem, no need to say it twice. */
  const adher=adherenceWindow(14);
  if(!runDormancyFired && adher.runsMissed>=2)
    flags.push({sev:'watch',
      title:'Running’s slipped this fortnight',
      detail:adher.runsMissed+' of your last '+adher.runsPlanned+' runs missed. Your engine runs on consistency — if your week’s changed, export a brief and we’ll adjust.',
      t:'Missed '+adher.runsMissed+'/'+adher.runsPlanned+' runs (14d) — aerobic base not building; consider re-planning'});
  else if(adher.gymMissed>=2)
    flags.push({sev:'watch',
      title:'Gym’s been on-and-off',
      detail:adher.gymMissed+' of '+adher.gymPlanned+' sessions missed. If the schedule isn’t fitting your life, let’s reshape it — export a brief.',
      t:'Missed '+adher.gymMissed+'/'+adher.gymPlanned+' gym sessions (14d) — consider re-planning'});

  /* goal stats — filled from the LOG, not authored (matches the whole app).
     g4 = the ladder's sustainable jog bout · g1 = fastest logged ≥3km run ·
     g2 = best Cooper-test distance · g3 = latest bodyweight. baseline is the
     earliest measurement, current the best, so the bar shows real progress. */
  const gs={};
  const speedRuns=sess.filter(s=>s.kind==='run'&&s.speed_kmh&&s.distance_km>=3).sort((a,b)=>a.date.localeCompare(b.date));
  if(speedRuns.length) gs.g1={ base:speedRuns[0].speed_kmh, cur:Math.max(...speedRuns.map(s=>s.speed_kmh)) };
  const coopers=sess.filter(s=>s.kind==='run'&&s.modality==='test_cooper'&&s.distance_km).sort((a,b)=>a.date.localeCompare(b.date));
  if(coopers.length){ const m=coopers.map(s=>Math.round(s.distance_km*1000)); gs.g2={ base:m[0], cur:Math.max(...m) }; }

  return {per, run7, run28, flares, flareAreas, bw, ladder:L, flags, adherence:adher, gs};
}

/* effective goal value, derived from the log where possible */
function goalStat(g,D){
  if(g.id==='g3') return {cur:(D.bw!=null?D.bw:g.current), base:g.baseline, target:g.target};
  if(g.id==='g4') return {cur:(D.ladder?+(+D.ladder.jog).toFixed(1):g.current), base:g.baseline, target:g.target};
  if(g.id==='g1'&&D.gs.g1) return {cur:D.gs.g1.cur, base:Math.min(D.gs.g1.base, g.target), target:g.target};
  if(g.id==='g2'&&D.gs.g2) return {cur:D.gs.g2.cur, base:Math.min(D.gs.g2.base, g.target), target:g.target};
  return {cur:g.current, base:g.baseline, target:g.target};
}

/* Adherence over the past `days` days (training days only, >= install date). */
function adherenceWindow(days){
  const t=today(), created=dayKey((S.meta&&S.meta.created_at)||t);
  let planned=0, logged=0, runsPlanned=0, runsMissed=0, gymPlanned=0, gymMissed=0;
  for(let i=days;i>=0;i--){
    const d=addDays(t,-i);
    if(d>t || d<created) continue;
    const plan=planForDate(d); if(!plan) continue;   // rest day
    planned++;
    const hit=!!sessOn(d,plan.kind);
    if(hit) logged++;
    if(plan.kind==='run'){ runsPlanned++; if(!hit) runsMissed++; }
    if(plan.kind==='gym'){ gymPlanned++; if(!hit) gymMissed++; }
  }
  return {planned, logged, runsPlanned, runsMissed, gymPlanned, gymMissed};
}

function progressOf(g,D){
  const s = D? goalStat(g,D) : {cur:g.current, base:g.baseline, target:g.target};
  if(g.qualitative||s.cur==null||s.base==null||s.target==null||s.target===s.base) return null;
  return clamp((s.cur-s.base)/(s.target-s.base),0,1);
}

/* ================= FAST LOOP (§5.1–5.5) ================= */
function readinessScore(r){ if(!r) return 3;
  return +(((r.sleep||3)+(6-(r.stress||3))+(6-(r.soreness||3))+(r.energy||3))/4).toFixed(2); }

/* Readiness -> whole PLATE STEPS, not a percentage.
   A percentage band cannot survive plate rounding: -1.5% of a 105 kg trap bar
   is -1.6 kg, which rounds to nothing, so moderate readiness silently did
   nothing and the 1-5 scale collapsed into three outcomes. Steps are always
   expressible, monotonic, and legible. (Supersedes the old +/-6% band.) */
function readinessSteps(score){
  if(score>=4.00) return  1;
  if(score>=2.75) return  0;
  if(score>=2.25) return -1;
  if(score>=1.75) return -2;
  return -3;
}
function readinessVerdict(score){
  const s=readinessSteps(score);
  return s>0   ? 'green light — one step up'
       : s===0 ? 'normal range — loads unchanged'
       : s===-1? 'backing off one step'
       : s===-2? 'backing off two steps'
       :         'heavily backed off — consider making today a walk';
}

function planGym(day, readiness, D, iso){
  const steps=readinessSteps(readinessScore(readiness));
  const onDate=iso||today();
  return day.slots.map(sl=>{
    let exId=slotExercise(sl,onDate), swapped=null;   // rotation resolves here (§5.7)
    if(D.flareAreas.includes('back') && ['trap_bar_dl','front_squat'].includes(exId)){
      swapped=exId; exId = exId==='trap_bar_dl' ? 'hip_thrust' : 'leg_press';
    } else if(D.flareAreas.includes('knee') && ['front_squat','rfe_split_squat'].includes(exId)){
      swapped=exId; exId='leg_press';
    }
    const e=ex(exId), d=D.per[exId];
    const targetReps=sl.reps[1], targetRpe=sl.rpe;
    let suggested=null, basis='first time — log your working weight', mods=[];

    if(e.log==='time'){ basis=targetReps+'s hold'; }
    else if(e.log==='weight_distance'){ basis='log the load and the distance you covered'; }
    else if(e.log==='reps'){ basis='bodyweight — log your reps'; }
    else if(targetRpe && d && d.e1>0){
      let L=loadFor(d.e1, targetReps, targetRpe, e.increment||2.5);
      basis='e1RM '+fmt(d.e1)+' kg → '+targetReps+'×@'+targetRpe;
      if(d.rpe_drift>=1.0){ const c=round(L*0.05, e.increment||2.5); L-=c; mods.push('−'+fmt(c)+' drift'); }
      if(steps!==0){ const a=steps*(e.increment||2.5); L+=a; mods.push((a>0?'+':'')+fmt(a)+' readiness'); }
      if(progressionEarned(exId, sl)){ L+=(e.increment||2.5); mods.push('+'+fmt(e.increment)+' progression'); }
      suggested=Math.max(e.increment||2.5, round(L, e.increment||2.5));
    }
    else if(targetRpe){
      /* No history on this exact exercise yet — usually because rotation just
         swapped it in. Borrow the best-known e1RM from a sibling exercise in
         the same movement pattern rather than leaving the lifter with nothing
         to start from. Deliberately skips drift/progression (meaningless for
         borrowed data); readiness still applies since it's a property of
         today, not of the exercise. */
      const sib=S.exercises.filter(o=>o.pattern===e.pattern && o.id!==exId)
        .map(o=>({o, e1:(D.per[o.id]||{}).e1||0})).sort((a,b)=>b.e1-a.e1)[0];
      if(sib && sib.e1>0){
        let L=loadFor(sib.e1, targetReps, targetRpe, e.increment||2.5);
        if(steps!==0){ const a=steps*(e.increment||2.5); L+=a; mods.push((a>0?'+':'')+fmt(a)+' readiness'); }
        suggested=Math.max(e.increment||2.5, round(L, e.increment||2.5));
        basis='estimated from '+sib.o.name+' (e1RM '+fmt(sib.e1)+' kg) — different exercise, start here and let RPE correct it';
      }
    }
    return {slot:sl, ex:e, exId, swapped, targetReps, targetRpe, suggested, basis, mods};
  });
}
function progressionEarned(exId, sl){
  if(!sl.rpe) return false;
  const last=[...S.sessions].filter(s=>s.kind==='gym'&&(s.sets||[]).some(x=>x.exercise_id===exId))
    .sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!last) return false;
  const sets=last.sets.filter(x=>x.exercise_id===exId);
  return sets.length>0 && sets.every(x=>x.actual.reps>=sl.reps[1] && x.actual.rpe!=null && x.actual.rpe<=sl.rpe);
}
function planRun(day, D){
  const gated=D.flareAreas.some(a=>['knee','ankle','back'].includes(a));
  const tol=goal('g4').baseline;
  if(day.modality==='run_walk'){
    const L=D.ladder;
    if(gated) return {gated:true, headline:'⚠ Swap to LOW-IMPACT today',
      detail:'Symptom flare logged — impact is gated. Do '+(L.rounds*(L.jog+L.walk))+' min easy on the crosstrainer or bike instead. Protecting the tissue IS the route to the 5k.'};
    return {gated:false, headline:L.rounds+' × ('+fmt(L.jog)+' min jog / '+L.walk+' min walk)',
      detail:fmt(L.jog*L.rounds)+' min of jogging total.'+(tol?' Each bout stays under your '+tol+'-min symptom line.':'')};
  }
  if(day.modality==='ruck'){ const r=S.meta.ruck;
    return {gated:false, headline:r.minutes+' min ruck @ '+r.load_kg+' kg',
      detail:'Zone 2 + loaded carriage in one. Load HIGH and CLOSE to your back; lean slightly forward from the ankles — do NOT counter-arch to balance the pack. Progress the load slowly.'};
  }
  return {gated:false, headline:'35–45 min easy Zone 2',
    detail: gated? 'Flare logged — keep it to walking or the crosstrainer today.' : 'Nasal-breathing pace, RPE ≤4. Walk/jog mix.'};
}

/* ================= BRIEF EXPORT (§6) ================= */
function buildBrief(userNote){
  const D=derive(), P=S.program, L=[];
  L.push('# Coach — Training Brief');
  L.push('_Generated '+today()+' · program '+P.id+' v'+P.version+' · phase '+P.phase+', block week '+P.block_week+'_');
  L.push('');
  L.push('## Athlete');
  if(S.profile.note) L.push(S.profile.note);
  if(S.profile.constraints) L.push('**Constraints (must program around these):** '+S.profile.constraints);
  L.push('Week: Mon gym · Tue run · Wed gym · Fri ruck · Sun run (Thu/Sat rest + optional mobility). Gym is strength only, hard 45-min cap.');
  L.push('_Dumbbell/kettlebell and carry loads are logged per hand (one implement), not the total._');
  L.push('**Rotation:** accessory slots rotate weekly, main slots each 4-week block (same movement pattern). **Benchmark battery** — trap-bar DL, front squat, chest press, chest-supported row, lat pulldown, farmer carry — never rotates and is re-tested every 8 weeks; that is the long-term progression record. Vertical push is trained but deliberately never max-tested (arch risk).');
  L.push('');
  L.push('## Goals & progress');
  for(const g of S.goals){
    const p=progressOf(g,D);
    const cur = goalStat(g,D).cur;
    L.push('- **'+g.name+'**'+(g.gate?' _(GATE)_':'')+': '+(cur==null?'not set':fmt(cur)+' '+g.unit)+
      ' → target '+(g.target==null?'—':g.target+' '+g.unit)+(p!=null?' ('+Math.round(p*100)+'%)':'')+
      (g.qualitative&&g.note?' — '+g.note:''));
  }
  L.push('');
  L.push('## Signals (computed from the log)');
  L.push('- Running volume: '+Math.round(D.run7)+' min last 7d · '+Math.round(D.run28)+' min last 28d');
  L.push('- Bodyweight: '+(D.bw?D.bw+' kg':'not logged')+(goal('g3').target?' (target '+goal('g3').target+' kg)':''));
  L.push('- Impact ladder: '+fmt(D.ladder.jog)+' min jog × '+D.ladder.rounds+' rounds (walk '+D.ladder.walk+' min)');
  L.push('- Strength:');
  for(const id in D.per){
    if(!ex(id)) continue; const d=D.per[id];
    L.push('  - '+ex(id).name+': e1RM '+fmt(d.e1)+' kg · trend '+d.trend+
      (d.chg?' ('+(d.chg>0?'+':'')+fmt(d.chg)+' kg)':'')+' · RPE drift '+(d.rpe_drift>0?'+':'')+fmt(d.rpe_drift));
  }
  L.push('');
  L.push('## Symptoms (last 14 days)');
  if(!D.flares.length) L.push('- None logged. Clean.');
  else for(const f of D.flares) L.push('- '+f.date+': **'+f.area+'** severity '+f.severity+'/3');
  L.push('');
  L.push('## Flags');
  if(!D.flags.length) L.push('- None. Progression is clear to run.');
  else for(const f of D.flags) L.push('- ['+f.sev.toUpperCase()+'] '+f.t);
  L.push('');
  L.push('## Current program');
  for(const d of P.days){
    if(d.kind==='gym') L.push('- **'+d.dow.toUpperCase()+' — '+d.label+'**: '+d.slots.map(s=>
      (ex(s.exercise_id)?ex(s.exercise_id).name:s.exercise_id)+' '+s.sets+'×'+
      (s.reps[0]===s.reps[1]?s.reps[0]:s.reps.join('-'))+(s.rpe?' @RPE'+s.rpe:'')).join(' · '));
    else L.push('- **'+d.dow.toUpperCase()+' — '+d.label+'** ('+d.modality+')');
  }
  L.push('');
  L.push('## Recent sessions (last 10)');
  const rec=[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  if(!rec.length) L.push('- Nothing logged yet.');
  for(const s of rec){
    if(s.kind==='gym'){
      const tops={};
      for(const st of s.sets){
        const e=(st.log||'weight_reps')==='weight_reps'? e1rmOf(st.actual.load_kg,st.actual.reps,st.actual.rpe) : 0;
        if(!tops[st.exercise_id] || e>tops[st.exercise_id].e) tops[st.exercise_id]={e,st};
      }
      L.push('- '+s.date.slice(0,10)+' **'+s.day_label+'**'+(s.readiness?' (readiness '+fmt(readinessScore(s.readiness))+'/5)':'')+': '+
        Object.keys(tops).map(id=>(ex(id)?ex(id).name:id)+' '+setText(tops[id].st)).join('; ')+
        (s.note?' — "'+s.note+'"':''));
    } else if(s.kind==='run'){
      L.push('- '+s.date.slice(0,10)+' **'+s.day_label+'** ('+s.modality+'): '+s.duration_min+' min'+
        (s.distance_km?', '+s.distance_km+' km':'')+(s.load_kg?', '+s.load_kg+' kg':'')+', RPE '+(s.rpe||'—')+
        (s.note?' — "'+s.note+'"':''));
    } else if(s.kind==='mobility'){
      L.push('- '+s.date.slice(0,10)+' **mobility** ('+(s.minutes||10)+' min)'+(s.note?' — "'+s.note+'"':''));
    } else {
      const sy=(s.symptoms||[]).filter(x=>x.severity>0).map(x=>x.area+' '+x.severity).join(', ')||'clean';
      L.push('- '+s.date.slice(0,10)+' **morning check**: '+sy+(s.bodyweight_kg?' · '+s.bodyweight_kg+' kg':'')+
        (s.note?' — "'+s.note+'"':''));
    }
  }
  L.push('');
  if(userNote && userNote.trim()){ L.push('## My question'); L.push(userNote.trim()); L.push(''); }
  L.push('---');
  L.push('## Instructions for you (the coach)');
  L.push('You are my strength & conditioning coach. Principles: the CONSTRAINT governs the plan, not the goal — tissue tolerance (pain-free jogging) gates ALL impact progression. Aerobic base first. Anti-fragility via graded exposure. RPE autoregulation. Respect my constraints above absolutely.');
  L.push('');
  L.push('1. Tell me in plain English what the data says and what you would change — tie every change to a GOAL.');
  L.push('2. Then output the new plan as a SINGLE json code block matching this shape. Include only what you are changing. Use exercise ids from the current program.');
  L.push('');
  L.push('```json');
  L.push(JSON.stringify({
    rationale:'why this version exists — tied to my goals',
    phase:P.phase, block_week:P.block_week+1,
    ladder:{jog:D.ladder.jog, walk:D.ladder.walk, rounds:D.ladder.rounds},
    ruck:S.meta.ruck,
    days:[{id:'gym_a', slots:[{id:'a1', exercise_id:'trap_bar_dl', sets:3, reps:[5,5], rpe:7, rest:150}]}]
  },null,2));
  L.push('```');
  return L.join('\n');
}

/* ================= IMPORT PLAN (§6) ================= */
const MODALITIES=['run_walk','ruck','zone2'];
/* Copy ONLY known fields, each bounded. Never Object.assign untrusted input. */
function sanitizeSlot(ps, existing){
  const out = existing ? JSON.parse(JSON.stringify(existing)) : {id:sStr(ps.id,64)||uid('slot')};
  if(ps.exercise_id!==undefined){
    if(!ex(ps.exercise_id)) throw new Error('Unknown exercise id "'+sStr(ps.exercise_id,40)+'" — use ids from the current program.');
    out.exercise_id=ps.exercise_id;
  }
  if(!out.exercise_id) throw new Error('A slot is missing its exercise_id.');
  if(ps.sets!==undefined) out.sets=sInt(ps.sets,1,10,3);
  if(ps.reps!==undefined){
    const r=Array.isArray(ps.reps)? ps.reps : [ps.reps,ps.reps];
    out.reps=[sInt(r[0],1,300,5), sInt(r[1],1,300,5)];
    if(out.reps[1]<out.reps[0]) out.reps[1]=out.reps[0];
  }
  if(ps.rpe!==undefined)  out.rpe = ps.rpe===null? null : sNum(ps.rpe,5,10,7);
  if(ps.rest!==undefined) out.rest=sInt(ps.rest,0,900,90);
  if(ps.isometric!==undefined) out.isometric=!!ps.isometric;
  if(ps.carry!==undefined)     out.carry=!!ps.carry;
  return out;
}
function importPlan(text){
  let raw=(text||'').trim();
  if(raw.length>500000) throw new Error('That input is too large to be a plan.');
  const m=raw.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m) raw=m[1].trim();
  let p;
  try{ p=parseUntrusted(raw); }
  catch(e){ throw new Error('Not valid JSON — ask Claude to re-send just the json block.'); }
  if(!isObj(p)) throw new Error('Expected a JSON object.');

  const cur=S.program;
  const next=JSON.parse(JSON.stringify(cur));
  next.version=cur.version+1; next.supersedes=cur.version;
  next.created_at=nowISO(); next.created_by='claude';
  if(p.rationale!==undefined)  next.rationale=sStr(p.rationale,2000) || next.rationale;
  if(p.phase!==undefined)      next.phase=sInt(p.phase,1,10,next.phase);
  if(p.block_week!==undefined) next.block_week=sInt(p.block_week,1,52,next.block_week);

  if(Array.isArray(p.days)) for(const pd of p.days.slice(0,20)){
    if(!isObj(pd)) continue;
    const d=next.days.find(x=>x.id===pd.id);
    if(!d) continue;
    if(pd.label!==undefined)    d.label=sStr(pd.label,80) || d.label;
    if(pd.note!==undefined)     d.note=sStr(pd.note,500);
    if(pd.modality!==undefined && MODALITIES.includes(pd.modality)) d.modality=pd.modality;
    if(Array.isArray(pd.slots)){
      if(!Array.isArray(d.slots)) continue;              // never add lifts to a run day
      for(const ps of pd.slots.slice(0,12)){
        if(!isObj(ps)) continue;
        const i=d.slots.findIndex(x=>x.id===ps.id);
        if(i>=0) d.slots[i]=sanitizeSlot(ps,d.slots[i]);
        else if(d.slots.length<12) d.slots.push(sanitizeSlot(ps,null));
      }
    }
  }
  if(isObj(p.ladder)) S.meta.ladder={
    jog:    sNum(p.ladder.jog,    1, 60, S.meta.ladder.jog),
    walk:   sNum(p.ladder.walk,   0, 30, S.meta.ladder.walk),
    rounds: sInt(p.ladder.rounds, 1, 20, S.meta.ladder.rounds)
  };
  if(isObj(p.ruck)) S.meta.ruck={
    load_kg: sNum(p.ruck.load_kg, 0, 60,  S.meta.ruck.load_kg),
    minutes: sInt(p.ruck.minutes, 5, 300, S.meta.ruck.minutes)
  };

  S.programHistory.push({...cur, status:'archived'});
  S.program=next;
  return next;
}

/* ================= BACKUP ================= */
function backupData(){ const d={_format:'coach/1', exported_at:nowISO()}; for(const k of ALL_KEYS) d[k]=S[k]; return d; }

let backupBusy=false;
let lastBackupError=null;
function setBackupBusy(b){
  ['btnBackupTop','btnBackup','btnNudge'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){ el.disabled=b; if(b) el.dataset.lbl=el.textContent, el.textContent='working…';
            else if(el.dataset.lbl) el.textContent=el.dataset.lbl; }
  });
}
/* Export is tried share -> download -> clipboard. Each layer reports the REAL
   error. save()/render() run AFTER, outside the try, so a successful export is
   never reported as a failure. Re-entrancy guarded: the Web Share API rejects
   concurrent calls, and a double-tap used to surface as "Backup failed".      */
async function doBackup(){
  if(backupBusy){ toast('Backup already in progress…'); return; }
  backupBusy=true; setBackupBusy(true);
  lastBackupError=null;
  let done=false, how='', cancelled=false;
  const json=JSON.stringify(backupData(),null,2);
  const name='coach-backup-'+today()+'.json';
  const blob=new Blob([json],{type:'application/json'});

  try{
    // 1) Android share sheet -> Save to Drive
    try{
      if(navigator.canShare && typeof File!=='undefined'){
        const file=new File([blob],name,{type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file]});   // no title: some Android builds reject title+files
          done=true; how='share';
        }
      }
    }catch(e){
      if(e && e.name==='AbortError'){ cancelled=true; }
      else { lastBackupError=e; console.error('[backup] share failed:',e); }
    }
    // 2) download fallback
    if(!done && !cancelled){
      try{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=name; a.rel='noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
        done=true; how='download';
      }catch(e){ lastBackupError=e; console.error('[backup] download failed:',e); }
    }
    // 3) clipboard fallback — last resort, still gets the data off the device
    if(!done && !cancelled){
      try{ await navigator.clipboard.writeText(json); done=true; how='clipboard'; }
      catch(e){ lastBackupError=e; console.error('[backup] clipboard failed:',e); }
    }
  } finally { backupBusy=false; setBackupBusy(false); }

  if(cancelled){ toast('Backup cancelled'); return; }

  if(done){
    try{ S.meta.last_backup=nowISO(); await save(); }
    catch(e){ console.error('[backup] exported OK but saving the timestamp failed:',e); }
    toast(how==='clipboard' ? 'Copied to clipboard ✓ — paste it somewhere safe'
        : how==='download'  ? 'Backup downloaded ✓' : 'Backed up ✓');
    try{ render(); }catch(e){ console.error('[backup] render after backup failed:',e); }
  } else {
    const e=lastBackupError;
    toast('Backup failed — '+(e ? (e.name||'Error')+': '+(e.message||'no detail') : 'no export method available'));
  }
}
async function doRestore(file){
  if(file.size>20*1024*1024) throw new Error('That file is too large to be a backup.');
  const d=parseUntrusted(await file.text());
  if(!isObj(d)) throw new Error('Not a backup file.');
  if(d._format!=='coach/1') throw new Error('Unrecognised backup format.');
  if(!Array.isArray(d.sessions) || !isObj(d.program) || !Array.isArray(d.goals))
    throw new Error('Backup is missing required data — refusing to load it.');
  for(const k of PERSIST_KEYS) if(d[k]!==undefined) S[k]=d[k];   // user data from backup; library comes from code
  applyLibraryAndMigrate();                                      // fresh library + migrate an old restored program
  await save(); App.draft=null; App.check=null; render(); toast('Restored ✓');
}

/* route/checkpoint progress — START ●···◆ NOW ···◇ OBJECTIVE (spec §13).
   Drawn in a fixed 680x46 user space; scales to container width via width:100%. */
function routeProgress(g,D){
  const s=goalStat(g,D), p=progressOf(g,D);
  if(p==null||s.base==null||s.target==null) return '';
  const x0=30, x1=490, span=x1-x0, y=18, nx=+(x0+span*Math.max(0,Math.min(1,p))).toFixed(1);
  const tick=f=>{const x=(x0+span*f).toFixed(1), on=p>=f-0.001;
    return '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="'+(on?'var(--accent)':'var(--bg)')+'" stroke="var(--line-strong)" stroke-width="1.8"/>';};
  const objStroke=g.gate?'var(--warn)':'var(--dim)';
  return '<svg class="rp" viewBox="0 0 520 48" role="img" aria-label="route to objective">'+
    '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--line-strong)" stroke-width="3.5"/>'+
    '<line x1="'+x0+'" y1="'+y+'" x2="'+nx+'" y2="'+y+'" stroke="var(--accent)" stroke-width="5"/>'+
    '<circle cx="'+x0+'" cy="'+y+'" r="6" fill="var(--accent)"/>'+
    tick(0.25)+tick(0.5)+tick(0.75)+
    '<path d="M'+nx+' '+(y-8)+'l8 8-8 8-8-8z" fill="var(--accent)"/>'+
    '<path d="M'+x1+' '+(y-9)+'l9 9-9 9-9-9z" fill="none" stroke="'+objStroke+'" stroke-width="2.4" stroke-dasharray="3 2.5"/>'+
    (g.gate?'<path d="M'+x1+' '+(y-15)+'l15 15-15 15-15-15z" fill="none" stroke="var(--warn)" stroke-width="1.8"/>':'')+
    '<text x="'+x0+'" y="43" text-anchor="start" fill="var(--dim)" font-family="var(--mono)" font-size="13">START</text>'+
    (p>0.14&&p<0.86?'<text x="'+nx+'" y="43" text-anchor="middle" fill="var(--accent)" font-family="var(--mono)" font-size="13" font-weight="700">NOW '+Math.round(p*100)+'%</text>':'')+
    '<text x="'+x1+'" y="43" text-anchor="end" fill="var(--dim)" font-family="var(--mono)" font-size="13">OBJECTIVE</text>'+
  '</svg>';
}
/* thin graphite trend line — no gradient, minimal chrome (spec §13) */
function sparkline(pts,opt){
  const o=opt||{}, v=(pts||[]).map(x=>typeof x==='number'?x:x&&x.v).filter(n=>n!=null&&!isNaN(n));
  if(v.length<3) return emptyState('route', o.emptyTitle||'Not enough data yet');
  const W=320,H=44,PX=4,PY=6, min=Math.min(...v), max=Math.max(...v), rng=(max-min)||1, n=v.length;
  const X=i=>(PX+i/(n-1)*(W-2*PX)).toFixed(1), Y=k=>(H-PY-(k-min)/rng*(H-2*PY)).toFixed(1);
  const pline=v.map((k,i)=>X(i)+','+Y(k)).join(' ');
  const gy=(H-PY-0.5*(H-2*PY)).toFixed(1);
  const dots=v.map((k,i)=>'<circle cx="'+X(i)+'" cy="'+Y(k)+'" r="'+(i===n-1?3:1.8)+'" fill="'+(i===n-1?'var(--accent)':'var(--ink)')+'"/>').join('');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="trend">'+
    '<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/>'+
    '<polyline points="'+pline+'" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
}
/* segmented measurement gauge — ticked cells filled to `pct` (0..1) */
function segbar(pct,gate){
  const n=10, filled=Math.round(Math.max(0,Math.min(1,pct||0))*n);
  let s='<div class="segbar'+(gate?' gate':'')+'">';
  for(let i=0;i<n;i++) s+='<span'+(i<filled?' class="on"':'')+'></span>';
  return s+'</div>';
}

function render(){
  const setup=!S.meta.setup_done;
  document.body.classList.toggle('setup', setup);
  const D=derive();
  document.getElementById('hdrSub').textContent = setup? 'first-run setup'
    : 'v'+S.program.version+' · phase '+S.program.phase+' · wk '+S.program.block_week;
  const bm=document.getElementById('btnMenu');
  bm.style.display = setup? 'none':'';
  bm.innerHTML = ICON.expand();
  document.querySelector('.brandmark').innerHTML = ICON.brand();
  const v=document.getElementById('view'); v.className='wrap fade';

  if(setup){ v.innerHTML=vSetup(); document.getElementById('tabbar').innerHTML=''; renderMenu(); wireSetup(); return; }

  v.innerHTML = App.tab==='goals'? vGoals(D) : App.tab==='today'? vToday(D)
              : App.tab==='cal'? vCal(D) : App.tab==='check'? vCheck(D)
              : App.tab==='coach'? vCoach(D) : vData(D);
  document.getElementById('tabbar').innerHTML=
    [['goals',ICON.goals(App.tab==='goals'),'Goals'],['today',ICON.today(App.tab==='today'),'Today'],
     ['cal',ICON.calendar(App.tab==='cal'),'Cal'],['check',ICON.checkpoint(App.tab==='check'),'Check']]

  renderMenu();
  wire(D);
}

    '<button data-menu="coach"'+(App.tab==='coach'?' style="color:var(--accent)"':'')+'><span class="ico">'+ICON.coach()+'</span>Coach</button>'+
    '<button data-menu="data"'+(App.tab==='data'?' style="color:var(--accent)"':'')+'><span class="ico">'+ICON.supply()+'</span>Data</button>'+
    '<button data-menu="backup"><span class="ico">'+ICON.diamond()+'</span>Back up now</button>';

}

function wireSetup(){
  document.getElementById('btnSetup').onclick=async()=>{
    const jog=num('sJogNow');
    if(!jog) return toast('Enter your pain-free jog minutes — it is the gate');

    S.profile.note=val('sNote').trim();
    S.profile.constraints=val('sCon').trim();

    /* ladder starts at ~half your symptom-line tolerance (safe bouts), ~20 min jogging */
    const j=clamp(round(jog/2,0.5),2,8);
    S.meta.ladder={ jog:j, walk:2, rounds:clamp(Math.round(20/j),3,6) };

    /* jog-gate goal tracks the ladder bout: baseline = where the ladder STARTS
       (not your flare threshold), so progress climbs cleanly 0->100% toward target */
    const g4=goal('g4'); g4.baseline=j; g4.current=j; g4.target=num('sJogTgt')||30;
    const g3=goal('g3'); g3.baseline=num('sBwNow'); g3.current=num('sBwNow'); g3.target=num('sBwTgt');
    goal('g1').target=num('sSpd')||12;
    goal('g2').target=num('sCoop')||2400;
    const g6=goal('g6');
    if(val('sG6').trim()) g6.name=val('sG6').trim();
    g6.note=val('sG6n').trim();

    /* benchmarks -> e1RM seeds */
    const seeds={};
    for(const b of BENCH){
      const kg=num('bk_'+b[0]), reps=num('br_'+b[0]), rpe=num('bp_'+b[0]);
      if(kg&&reps&&rpe){ const e=e1rmOf(kg,reps,rpe); if(e>0) seeds[b[0]]=+e.toFixed(1); }
    }
    S.meta.seed_e1rm=seeds;

    S.meta.program_start=today();     // anchor for the 4-week test cadence
    S.meta.setup_done=true;
    await save(); App.tab='goals'; render(); toast('Coach is ready ✓');
  };
}

function nudgeHTML(){ return checkNudgeHTML()+eveningRunNudgeHTML()+backupNudgeHTML(); }
/* Tue's run and Fri's ruck don't fit the morning (school drop-off + office) —
   evenings do. Nothing in the engine is time-of-day aware, so the only real
   gap is a same-day prompt: without this, an evening session can be silently
   skipped with no nudge at all until tomorrow's "yesterday's check" nudge —
   which is exactly how a 31-day run gap went unnoticed. No day reassignment;
   Tue/Fri stay put, this just covers the evening window that's actually free. */
function eveningRunNudgeHTML(){
  const t=today(), plan=planForDate(t);
  if(!plan || plan.kind!=='run') return '';
  if(sessOn(t,'run')) return '';
  if(new Date().getHours()<16) return '';
  return '<div class="nudge" style="border-color:var(--bad);color:var(--bad-ink)">'+
    '<div class="hand">'+ICON.alert()+' Tonight’s <b>'+esc(plan.label)+'</b> is still open.</div>'+
    '<button class="sm" id="btnEveningRun" style="background:var(--bad);color:var(--paper-light);border:none">Log it</button></div>';
}
function backupNudgeHTML(){
  const age=backupAgeDays();
  if(!S.sessions.length || age<7) return '';

   did the scheduled session happen. planForDate()/sessOn() already resolve
   test-day overrides, so this needs no special-casing for those. */
function weekChecklistHTML(D){
  const mon=mondayOf(today()), t=today();
  const items=Array.from({length:7},(_,i)=>{
    const d=addDays(mon,i), plan=planForDate(d);
    if(!plan) return {d, plan:null};
    const done=!!sessOn(d,plan.kind);

    return {d, plan, state};
  });
  const counts=k=>{ const s=items.filter(i=>i.plan&&i.plan.kind===k);
    return s.filter(i=>i.state==='done').length+'/'+s.length; };

/* Which fields a set logs, per the exercise's `log` type (spec §4).
   Previously a carry rendered "metres | reps" but bound metres to load_kg, and a
   40s hold stored load_kg:40. Each type now renders and stores its own fields. */
/* Per-implement label + hint, so it's clear whether to log one DB or the total.
   Convention: log ONE implement's weight (per dumbbell / per hand). */
function kgLabel(exr){
  if(exr.pattern==='carry') return 'kg/hand';
  if(exr.equip==='dumbbell') return 'kg/DB';
  if(exr.equip==='kettlebell') return 'kg/KB';
  return 'kg';                                 // barbell / machine = total
}
function perHandHint(exr){
  if(exr.pattern==='carry') return 'Log the weight in one hand.';
  if(exr.equip==='dumbbell') return 'Log one dumbbell’s weight (not the pair).';
  if(exr.equip==='kettlebell') return 'Log one kettlebell’s weight.';
  return '';
}
/* Unilateral exercises never say whether the rep count is per side or total —
   answer it directly instead of leaving it to guesswork on the gym floor. */
function perSideNoun(exr){
  if(!exr.tags.includes('unilateral')) return '';
  return ['squat','hinge','calf'].includes(exr.pattern) ? 'leg' : 'arm';
}
/* Short, human labels for why a given exercise is programmed — reused as
   small badges so the reasoning behind a slot is visible, not just implied. */
const TAG_LABELS={
  anti_extension:'Anti-extension core', anti_rotation:'Anti-rotation',
  tendon_iso:'Tendon loading', back_sparing:'Low spinal load',
  carry:'Loaded carry', unilateral:'Unilateral',
  tactical_stance:'Shooting-stance carryover', tactical_patrol:'Patrol-load carryover',
  tactical_contact:'Ground-to-standing / contact', benchmark:'Benchmark lift'
};
function logFields(exr){
  const inc=exr.increment||2.5, kg=kgLabel(exr);
  switch(exr.log){
    case 'weight_distance': return [{k:'load',label:kg,step:inc},{k:'dist',label:'metres',step:5}];
    case 'time':            return [{k:'secs',label:'seconds',step:5}];
    case 'reps':            return [{k:'reps',label:'reps',step:1}];
    default:                return [{k:'load',label:kg,step:inc},{k:'reps',label:'reps',step:1}];
  }
}
function blankSet(r){
  const t=r.ex.log, o={rpe:''};
  if(t==='time') o.secs = r.targetReps;
  else if(t==='reps') o.reps = r.targetReps;
  else if(t==='weight_distance'){ o.load = r.suggested!=null?r.suggested:''; o.dist = r.targetReps; }
  else { o.load = r.suggested!=null?r.suggested:''; o.reps = r.targetReps; }
  return o;
}
function gymSlot(r){
  const sl=r.slot, t=r.ex.log;

  const arr=App.draft.actuals[sl.id];

  const side=perSideNoun(r.ex), sideNote=side?' (each '+side+')':'';
  const head = (t==='time' ? sl.reps[1]+'s hold'
             : t==='weight_distance' ? (r.suggested!=null? r.suggested+' kg × ':'')+sl.reps[1]+' m'
             : t==='reps' ? sl.reps[1]+' reps'
             : (r.suggested!=null ? r.suggested+' kg' : '—')) + sideNote;
  const tag = t==='time' ? sl.sets+'×'+sl.reps[1]+'s'
            : t==='weight_distance' ? sl.sets+'×'+sl.reps[1]+'m'
            : sl.sets+'×'+(sl.reps[0]===sl.reps[1]?sl.reps[0]:sl.reps.join('-'));
  const purpose=(r.ex.tags||[]).map(x=>TAG_LABELS[x]).filter(Boolean);
  return '<div class="card">'+

/* Check tab is now the history/trend view — the input form moved to the home
   tab (checkInCardHTML). Flares and bodyweight are the two things worth
   looking back over; the 7-day trailing average smooths day-to-day noise out
   of the raw bodyweight readings. */
function vCheck(D){
  const checksAsc=S.sessions.filter(s=>s.kind==='check').sort((a,b)=>a.date.localeCompare(b.date));
  const bwPoints=checksAsc.filter(s=>s.bodyweight_kg!=null).map(s=>({date:s.date, v:s.bodyweight_kg}));
  const avg7=dateISO=>{
    const cutoff=new Date(dateISO); cutoff.setUTCDate(cutoff.getUTCDate()-6);
    const win=bwPoints.filter(p=>new Date(p.date)>=cutoff && new Date(p.date)<=new Date(dateISO));
    return win.length? win.reduce((a,b)=>a+b.v,0)/win.length : null;
  };
  const latest=bwPoints.length?bwPoints[bwPoints.length-1]:null;
  const latestAvg=latest?avg7(latest.date):null;
  const recent=[...checksAsc].reverse().slice(0,21);
  return '<div class="col">'+nudgeHTML()+
    (latest?'<div class="card"><h3>Bodyweight — 7-day trailing average</h3>'+
      '<div class="goal"><div class="val hand" style="font-size:24px">'+fmt(latestAvg)+' <span class="dim" style="font-size:13px">kg</span></div>'+
      (bwPoints.length>=3?'<div style="margin-top:8px">'+sparkline(bwPoints.map(p=>p.v))+'</div>':'')+
      '<div class="hint hand" style="margin-top:5px;color:var(--dim)">Latest logged: '+fmt(latest.v)+' kg on '+dlabel(latest.date)+'</div></div></div>'
    :'')+
    strengthTrendHTML(D)+
    '<div class="card"><h3>Recent checks</h3>'+
      (recent.length? recent.map(s=>{
        const sy=(s.symptoms||[]).filter(x=>x.severity>0);
        const bwAvg=s.bodyweight_kg!=null?avg7(s.date):null;
        return '<div class="row" style="justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)">'+
          '<span class="mono dim">'+esc(String(s.date).slice(5,10))+'</span>'+
          '<span>'+(sy.length? sy.map(x=>'<span class="pill '+(x.severity>=2?'bad':'warn')+' flag">'+esc(x.area)+' '+esc(x.severity)+'</span>').join(' ') : '<span class="pill good flag">clean</span>')+'</span>'+
          '<span class="dim">'+(s.bodyweight_kg!=null? '<span class="hand" style="color:var(--ink);font-size:14px">'+fmt(s.bodyweight_kg)+' kg</span>'+(bwAvg!=null?' <span class="mono">· 7d '+fmt(bwAvg)+'</span>':''):'')+'</span></div>';
      }).join('') : emptyState('clipboard','No checks logged yet','<div class="hint">Log your first morning check from the Goals tab.</div>'))+
    '</div></div>';
}

  const nt=nextTestDate();

      (nt?'<div class="hint" style="margin-top:5px;display:flex;align-items:center;gap:4px">'+ICON.diamond()+' Next test: <b>'+esc(nt.test.name)+'</b> · '+dlabel(nt.date)+'</div>':'')+'</div>'+

      '<button class="txtbtn" id="calNext">Next ›</button></div>'+
    '<div class="card" style="padding:2px 10px">'+rows+'</div>'+
  '</div>';
}
function calRow(d,D){
  const t=today(), plan=planForDate(d);
  const created=dayKey((S.meta&&S.meta.created_at)||t);
  const pre=d<created, isToday=d===t, isFuture=d>t;
  const label=plan?plan.label:'Rest';
  const logged = plan && !isFuture ? sessOn(d,plan.kind) : null;
  const chk=sessOn(d,'check'), flare=dayFlareOn(d);
  let pill='';
  if(pre){} else if(isToday) pill='<span class="todaymark">today</span>';
  else if(isFuture) pill = plan?'<span class="pill dim">planned</span>':'';
  else if(plan) pill = logged?'<span class="pill good">✓ logged</span>':'<span class="pill bad">✕ missed</span>';
  const glyph = (!plan||isFuture||pre) ? ''
    : chk ? '<span class="glyph '+(flare?'flare':'clean')+'">'+ICON.checkpoint(!flare)+'</span>'
          : '<span class="glyph open">'+ICON.ring()+'</span>';
  const testTag = (plan&&(plan.test||plan.strengthTest)&&!pre) ? ' <span class="pill test">test</span>' : '';
  /* rest day that had mobility logged gets a quiet tick — it is never "missed" */
  const mobTag = (!plan&&!pre&&S.sessions.some(s=>s.kind==='mobility'&&dayKey(s.date)===d))
    ? '<span class="pill good">✓ mobility</span>' : '';
  const open=App.cal.open===d;
  return '<div class="calrow'+(isToday?' istoday':'')+(pre?' pre':'')+'">'+
    '<div class="hd" data-toggle="'+d+'"><span><span class="date">'+dlabel(d)+'</span><span class="lbl">'+esc(label)+'</span>'+testTag+'</span>'+
      '<span>'+pill+mobTag+glyph+'</span></div>'+
    (open?'<div class="detail">'+calDetail(d,plan,D)+'</div>':'')+
  '</div>';
}
/* Names for a gym day ON A GIVEN DATE — must resolve rotation, or the calendar
   shows the base program instead of what you'll actually do (§5.7). */
function slotNames(plan, iso){
  return plan.slots.map(sl=>{ const e=ex(slotExercise(sl,iso)); return e?e.name:sl.exercise_id; }).join(' · ');
}
function calDetail(d,plan,D){
  const t=today(), created=dayKey((S.meta&&S.meta.created_at)||t);
  if(!plan){
    const mob=S.sessions.find(s=>s.kind==='mobility'&&dayKey(s.date)===d);
    return '<div class="hint">Rest day — nothing owed.</div>'+
      (mob?'<div class="hint" style="margin-top:6px;color:var(--good)">✓ Mobility logged</div>'
          :(d<=t?'<div class="hint" style="margin-top:6px">Optional ~10 min mobility flow — see the Today tab.</div>':''));
  }
  if(d<created) return '<div class="hint">Before this coach existed on your device.</div>';
  if(d>t){                                   // future — preview only
    if(plan.test){ const tt=TESTS.find(x=>x.id===plan.test.id);
      return '<div class="callout" style="border-color:var(--accent-2)"><b>'+esc(tt.name)+' — test day</b>'+
        '<div class="muted" style="margin-top:4px">'+esc(testDesc(tt.id))+' Replaces this day’s run.</div></div>'; }
    if(plan.kind==='gym') return '<div class="hint">'+esc(slotNames(plan,d))+'</div>'+
      (plan.strengthTest?'<div class="hint" style="margin-top:6px">One top set @ RPE 8 per lift — the 8-weekly progression record.</div>':'');
    const p=planRun(plan,D);
    return '<div class="callout"><b>'+esc(p.headline)+'</b><div class="muted" style="margin-top:4px">'+esc(p.detail)+'</div></div>'+
      '<div class="hint" style="margin-top:6px">Preview — computed from today’s state.</div>';
  }
  const s=sessOn(d,plan.kind);
  if(s){                                      // logged — read-only summary
    const late = s.backdated || (s.created_at && daysBetween(s.created_at,s.date)>0.9);
    const tag = late?'<span class="tag"> · logged late</span>':'';
    if(plan.kind==='gym'){
      const byEx={}; for(const st of s.sets){ (byEx[st.exercise_id]=byEx[st.exercise_id]||[]).push(st); }
      return Object.keys(byEx).map(id=>'<div class="hint"><b>'+esc(ex(id)?ex(id).name:id)+'</b> '+
        esc(byEx[id].map(setText).join(' · '))+'</div>').join('')+
        '<div class="hint" style="margin-top:6px">Readiness '+fmt(readinessScore(s.readiness))+'/5'+(s.note?' · “'+esc(s.note)+'”':'')+tag+'</div>';
    }
    return '<div class="hint">'+s.duration_min+' min'+(s.distance_km?', '+s.distance_km+' km':'')+(s.load_kg?', '+s.load_kg+' kg':'')+
      ', RPE '+(s.rpe||'—')+(s.note?' · “'+esc(s.note)+'”':'')+tag+'</div>';
  }
  if(plan.test){                              // missed test day — single-input catch-up
    const tt=TESTS.find(x=>x.id===plan.test.id);
    if(App.backdate && App.backdate.date===d)
      return '<div class="callout warn" style="margin-bottom:8px">⚠ Back-dated '+esc(tt.name)+' for <b>'+dlabel(d)+'</b>.</div>'+
        '<label class="f">'+esc(tt.ask)+'</label><input type="number" inputmode="decimal" step="0.1" id="testVal">'+
        '<div class="row" style="margin-top:8px"><button class="sm primary" data-bdtest="'+plan.test.id+'|'+d+'">Save</button>'+
        '<button class="sm ghost" id="bdCancel">Cancel</button></div>';
    return '<div class="hint">'+esc(tt.name)+' — you missed this test day.</div>'+
      '<div class="hint" style="margin:6px 0">Did the test and forget to log it?</div>'+
      '<button class="sm" data-backdate="'+d+'">Log result (back-dated)</button>';
  }
  if(App.backdate && App.backdate.date===d)   // mid back-date entry
    return plan.kind==='gym'? vBackdateGym(plan,d) : vBackdateRun(plan,d);
  const planTxt = plan.kind==='gym'? slotNames(plan,d) : plan.label;
  return '<div class="hint">Planned: '+esc(planTxt)+'</div>'+
    '<div class="hint" style="margin:6px 0">Did you train this and forget to log it?</div>'+
    '<button class="sm" data-backdate="'+d+'">Log it now (back-dated)</button>';
}

async function saveBackdate(){
  const iso=App.backdate.date, day=planForDate(iso);
  const dateISO=iso+'T12:00:00.000Z';
  if(day.kind==='gym'){
    const by={}; document.querySelectorAll('[data-bd]').forEach(inp=>{
      const {bd,i,k}=inp.dataset; ((by[bd]=by[bd]||{})[i]=by[bd][i]||{})[k]=inp.value; });
    const sets=[];
    for(const sl of day.slots){ const g=by[sl.id]||{};
      const exId=slotExercise(sl,iso), exr=ex(exId), t=exr?exr.log:'weight_reps';
      Object.keys(g).forEach(i=>{ const a=g[i];
        if(!hasData(t,a)) return;
        sets.push({ id:uid('set'), exercise_id:exId, set_index:+i+1, log:t,
          prescribed:{ load_kg:null, reps:sl.reps[1], rpe:sl.rpe!=null?sl.rpe:null },
          actual: buildActual(t,a) }); });
    }
    if(!sets.length) return toast('Enter at least one set');
    S.sessions.push({ id:uid('s'), kind:'gym', date:dateISO, day_id:day.id, day_label:day.label,
      program_id:S.program.id, program_version:S.program.version, readiness:null, sets,
      note:val('bdNote'), backdated:true, created_at:nowISO() });
  } else {
    const dur=num('bdDur'); if(!dur) return toast('Enter the duration');
    const dist=num('bdDist');
    const s={ id:uid('s'), kind:'run', date:dateISO, day_id:day.id, day_label:day.label,
      program_id:S.program.id, program_version:S.program.version, modality:day.modality,
      duration_min:dur, distance_km:dist, rpe:num('bdRpe'),
      load_kg: day.modality==='ruck'? num('bdLoad'):null, note:val('bdNote'), backdated:true, created_at:nowISO() };
    if(dist&&dur) s.speed_kmh=+((dist/(dur/60)).toFixed(2));
    S.sessions.push(s);
  }
  const d=App.backdate.date; App.backdate=null; App.cal.open=d;
  await save(); render(); toast('Back-dated log saved for '+dlabel(d)+' ✓');
}

/* ================= WIRE ================= */
function wire(D){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ App.tab=b.dataset.tab; App.briefOut=null; render(); });
  const nb=document.getElementById('btnNudge'); if(nb) nb.onclick=doBackup;

  // hamburger menu (Coach / Data / Back up). Panel items are wired in renderMenu()
  // because the panel HTML is rebuilt on every toggle.
  document.getElementById('btnMenu').onclick=()=>{ App.menuOpen=!App.menuOpen; renderMenu(); };
  const menu=document.getElementById('menu');
  menu.onclick=e=>{ if(e.target===menu){ App.menuOpen=false; renderMenu(); } };

  // check-owed nudge
  const cn=document.getElementById('btnCheckNudge'); if(cn) cn.onclick=()=>{ App.tab='goals'; render(); };
  const er=document.getElementById('btnEveningRun'); if(er) er.onclick=()=>{ App.tab='today'; render(); };

  // field tests -> feed goals
  document.querySelectorAll('[data-testedit]').forEach(b=>b.onclick=()=>{ App.testEdit=b.dataset.testedit; render();
    const tv=document.getElementById('testVal'); if(tv) tv.focus(); });
  const ts=document.getElementById('testSave'); if(ts) ts.onclick=()=>logTest(App.testEdit);
  const tc=document.getElementById('testCancel'); if(tc) tc.onclick=()=>{ App.testEdit=null; render(); };

  // calendar
  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{
    const d=el.dataset.toggle; App.cal.open = App.cal.open===d? null : d; App.backdate=null; render(); });
  const cp=document.getElementById('calPrev'); if(cp) cp.onclick=()=>{ App.cal.anchor=addDays(App.cal.anchor||today(),-7); App.cal.open=null; render(); };
  const cx=document.getElementById('calNext'); if(cx) cx.onclick=()=>{ App.cal.anchor=addDays(App.cal.anchor||today(),7); App.cal.open=null; render(); };
  const cj=document.getElementById('calJump'); if(cj) cj.onclick=()=>{ App.cal.anchor=today(); App.cal.open=null; render(); };
  document.querySelectorAll('[data-backdate]').forEach(b=>b.onclick=()=>{ App.backdate={date:b.dataset.backdate}; render(); });
  const bs=document.getElementById('bdSave'); if(bs) bs.onclick=saveBackdate;
  const bc=document.getElementById('bdCancel'); if(bc) bc.onclick=()=>{ App.backdate=null; render(); };
  document.querySelectorAll('[data-bdtest]').forEach(b=>b.onclick=()=>{
    const parts=b.dataset.bdtest.split('|'); logTest(parts[0], parts[1]+'T12:00:00.000Z'); });

  // Today: log a scheduled test day
  const bt=document.getElementById('btnLogTestDay');
  if(bt) bt.onclick=()=>{ const dd=todaysDay(); if(dd&&dd.test) logTest(dd.test.id); };

  document.querySelectorAll('[data-r]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    App.readiness[seg.dataset.r]=+b.dataset.v; App.draft=null; render(); }));
  document.querySelectorAll('[data-area]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    App.check.symptoms[seg.dataset.area]=+b.dataset.v; render(); }));
  document.querySelectorAll('input[data-s]').forEach(i=>i.oninput=()=>{
    App.draft.actuals[i.dataset.s][+i.dataset.i][i.dataset.k] = i.value===''?'':+i.value;
    if(i.dataset.k==='rpe') applyRpeCap(i.dataset.s, +i.dataset.i); });

  const b1=document.getElementById('btnLogGym');   if(b1) b1.onclick=logGym;
  const b2=document.getElementById('btnLogRun');   if(b2) b2.onclick=logRun;
  const b3=document.getElementById('btnLogCheck'); if(b3) b3.onclick=logCheck;
  const b4=document.getElementById('btnAnyDay');   if(b4) b4.onclick=()=>{ App.tab='goals'; render(); };
  const bm=document.getElementById('btnLogMob');
  if(bm) bm.onclick=async()=>{
    S.sessions.push({id:uid('s'), kind:'mobility', date:nowISO(), minutes:10,
      drills:MOB_FLOW.slice(), created_at:nowISO()});
    try{ await save(); }
    catch(e){ S.sessions.pop(); return toast('Couldn’t save: '+(e&&e.message||e)); }
    render(); toast('Mobility logged ✓');
  };

  const bb=document.getElementById('btnBrief');
  if(bb) bb.onclick=()=>{ const n=document.getElementById('briefNote');
    App.briefOut=buildBrief(n?n.value:''); render(); toast('Brief ready — copy it'); };
  const cb=document.getElementById('btnCopyBrief');
  if(cb) cb.onclick=async()=>{ try{ await navigator.clipboard.writeText(App.briefOut); toast('Copied ✓'); }
    catch(e){ toast('Select the text and copy manually'); } };
  const ip=document.getElementById('btnImportPlan');
  if(ip) ip.onclick=async()=>{
    const t=document.getElementById('planIn');
    if(!t || !t.value.trim()) return toast('Paste the json block first');
    try{ const n=importPlan(t.value); await save(); toast('Program v'+n.version+' applied ✓'); render(); }
    catch(e){ toast(e.message); }
  };

  const sp=document.getElementById('btnSaveProfile');
  if(sp) sp.onclick=async()=>{ S.profile.note=val('pfNote').trim(); S.profile.constraints=val('pfCon').trim();
    await save(); render(); toast('Profile saved ✓'); };

  const bk=document.getElementById('btnBackup');  if(bk) bk.onclick=doBackup;
  const rs=document.getElementById('btnRestore'); if(rs) rs.onclick=()=>document.getElementById('fileIn').click();
  const fi=document.getElementById('fileIn');
  if(fi) fi.onchange=e=>{ if(e.target.files[0]) doRestore(e.target.files[0]).catch(()=>toast('Bad backup file')); };
  const rst=document.getElementById('btnReset');
  if(rst) rst.onclick=async()=>{ if(!confirm('Wipe everything? Back up first.')) return;
    S=seedState(); await save(); App.draft=null; App.check=null; render(); toast('Reset'); };

  const si=document.getElementById('storeInfo');
  if(si && navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted().then(async p=>{
      let mb='?';
      try{ const e=await navigator.storage.estimate(); if(e&&e.usage) mb=(e.usage/1048576).toFixed(2); }catch(_){}
      si.innerHTML=(p? '✅ <b>Persistent</b> — Android has agreed not to evict your data.'
                     : '⚠️ Not persistent yet — install to your home screen to secure it.')+' <span class="dim">('+mb+' MB used)</span>';
    }).catch(()=>{ si.textContent='Storage status unavailable.'; });
  }
}

/* RPE cap (spec §5.1): a set logged above target+1 pulls the REMAINING unlogged
   sets down one increment. Updates the inputs directly rather than re-rendering,
   so it never steals focus mid-set. Idempotent — always derived from this set's
   own load, so retyping the RPE can't stack reductions. */
function applyRpeCap(slotId, setIdx){
  if(!App.draft || !App.draft.rows) return;
  const row=App.draft.rows.find(r=>r.slot.id===slotId);
  if(!row || !row.slot.rpe || row.ex.log!=='weight_reps') return;   // only load-based sets carry a load to reduce
  const arr=App.draft.actuals[slotId]; if(!arr) return;
  const a=arr[setIdx];
  if(a.rpe===''||a.rpe==null||isNaN(a.rpe)) return;
  if(a.rpe - row.slot.rpe <= 1) return;                 // within tolerance
  const inc=row.ex.increment||2.5;
  const cur=(a.load===''||a.load==null)? row.suggested : +a.load;
  if(cur==null||isNaN(cur)) return;
  const next=Math.max(inc, round(cur-inc, inc));
  let changed=0;
  for(let j=setIdx+1;j<arr.length;j++){
    if(arr[j].rpe!=='' && arr[j].rpe!=null) continue;   // already logged — leave it
    if(arr[j].load===next) continue;
    arr[j].load=next; changed++;
    const el=document.querySelector('input[data-s="'+slotId+'"][data-i="'+j+'"][data-k="load"]');
    if(el) el.value=next;
  }
  if(changed) toast('RPE '+a.rpe+' over target '+row.slot.rpe+' — remaining sets → '+next+' kg');
}

/* ================= LOGGERS (append-only) ================= */
/* Build a set's `actual` for the exercise's log type. Seconds are NEVER stored
   as load_kg, and a carry's distance is NEVER stored as reps (spec §4). */
function buildActual(logType, a){
  const n=v=>(v===''||v==null||isNaN(v))?null:+v;
  const rpe=n(a.rpe);
  if(logType==='time')            return {seconds:n(a.secs), rpe};
  if(logType==='reps')            return {reps:n(a.reps), rpe};
  if(logType==='weight_distance') return {load_kg:n(a.load), distance_m:n(a.dist), rpe};
  return {load_kg:n(a.load), reps:n(a.reps), rpe};
}
const hasData=(logType,a)=>{
  if(logType==='time') return a.secs!==''&&a.secs!=null;
  if(logType==='reps') return a.reps!==''&&a.reps!=null;
  if(logType==='weight_distance') return (a.load!==''&&a.load!=null)||(a.dist!==''&&a.dist!=null);
  return (a.load!==''&&a.load!=null)||(a.reps!==''&&a.reps!=null);
};
async function logGym(){
  const day=S.program.days.find(d=>d.id===App.draft.dayId);
  if(!day) return toast('Could not find this day in your program — reopen the tab and try again.');
  const sets=[];
  for(const r of App.draft.rows){
    const arr=App.draft.actuals[r.slot.id]||[], t=r.ex.log;
    arr.forEach((a,i)=>{
      if(!hasData(t,a)) return;
      sets.push({ id:uid('set'), exercise_id:r.exId, set_index:i+1, log:t,
        prescribed:{ load_kg:r.suggested!=null?r.suggested:null, reps:r.targetReps, rpe:r.targetRpe!=null?r.targetRpe:null },
        actual: buildActual(t,a) });
    });
  }
  if(!sets.length) return toast('Log at least one set');
  S.sessions.push({ id:uid('s'), kind:'gym', date:nowISO(), day_id:day.id, day_label:day.label,
    program_id:S.program.id, program_version:S.program.version, readiness:{...App.readiness}, sets,
    note:val('sessNote'), created_at:nowISO() });
  try{ await save(); }
  catch(e){ S.sessions.pop(); return toast('Couldn’t save: '+(e&&e.message||e)); }
  App.draft=null; App.tab='goals'; render(); toast('Session logged ✓');
}
async function logRun(){
  const day=S.program.days.find(d=>d.id===App.draft.dayId);
  if(!day) return toast('Could not find this day in your program — reopen the tab and try again.');
  const dur=num('rDur');
  if(!dur) return toast('Enter the duration');
  const dist=num('rDist');
  const s={ id:uid('s'), kind:'run', date:nowISO(), day_id:day.id, day_label:day.label,
    program_id:S.program.id, program_version:S.program.version, modality:day.modality,
    duration_min:dur, distance_km:dist, rpe:num('rRpe'),
    load_kg: day.modality==='ruck' ? num('rLoad') : null,
    note:val('rNote'), created_at:nowISO() };
  if(dist && dur) s.speed_kmh=+((dist/(dur/60)).toFixed(2));
  const prevRuck=S.meta.ruck.load_kg;
  S.sessions.push(s);
  if(day.modality==='ruck' && s.load_kg) S.meta.ruck.load_kg=s.load_kg;
  try{ await save(); }
  catch(e){ S.sessions.pop(); S.meta.ruck.load_kg=prevRuck; return toast('Couldn’t save: '+(e&&e.message||e)); }
  App.draft=null; App.tab='goals'; render(); toast('Run logged ✓ — check in tomorrow morning');
}
async function logCheck(){
  const bw=num('cBw');
  const g3=goal('g3'), prevG3=g3?g3.current:undefined;
  S.sessions.push({ id:uid('s'), kind:'check', date:nowISO(),
    symptoms:AREAS.map(a=>({area:a[0], severity:App.check.symptoms[a[0]]||0})),
    bodyweight_kg:bw, note:val('cNote'), created_at:nowISO() });
  if(bw && g3) g3.current=bw;
  try{ await save(); }
  catch(e){ S.sessions.pop(); if(g3) g3.current=prevG3; return toast('Couldn’t save: '+(e&&e.message||e)); }
  App.check=null; App.tab='goals'; render(); toast('Check logged ✓');
}

/* ================= MIGRATIONS ================= */
/* Exercises removed from the library -> what an already-programmed slot becomes. */
const REMOVED_MAP={ spanish_squat:'leg_extension', calf_tib:'calf_raise', rower:'bike', kb_swing:'trap_bar_dl', belt_squat:'leg_press' };

/* The library is always code-fresh; the program is user data, so it's migrated,
   not clobbered. Runs on boot AND on restore, so a restored old backup is also
   brought current. User data (sessions/goals/meta values) is never rewritten. */
function applyLibraryAndMigrate(){
  const seed=seedState();
  S.exercises = seed.exercises;                        // library ALWAYS from code
  if(!Array.isArray(S.goals)) S.goals=[];
  for(const sg of seed.goals) if(!S.goals.find(g=>g.id===sg.id)) S.goals.push(sg);   // backfill any missing goal
  if(!isObj(S.meta)) S.meta=seed.meta;
  if(S.meta.setup_done===undefined) S.meta.setup_done=true;
  if(!S.meta.program_start) S.meta.program_start=dayKey(S.meta.created_at||nowISO());
  if(!Array.isArray(S.programHistory)) S.programHistory=[];
  if(S.meta.lib_version!==LIB_VERSION){ migrateProgram(); S.meta.lib_version=LIB_VERSION; }
}
function migrateProgram(){
  const cur=S.program; if(!isObj(cur)) { S.program=seedState().program; return; }
  const adapted = cur.created_by==='claude' || (cur.version||1)>1;
  if(!adapted){
    // engine-authored v1 -> adopt the current template, keep the user's place in the block
    const next=seedState().program;
    next.id=cur.id||next.id; next.phase=cur.phase||next.phase; next.block_week=cur.block_week||next.block_week;
    S.program=next; return;
  }
  // user-adapted -> keep their plan, just purge removed lifts and backfill roles
  for(const d of cur.days){
    if(!Array.isArray(d.slots)) continue;
    for(const sl of d.slots){
      if(sl.exercise_id && !ex(sl.exercise_id) && REMOVED_MAP[sl.exercise_id]) sl.exercise_id=REMOVED_MAP[sl.exercise_id];
      if(!sl.role) sl.role='accessory';
    }
    // v3: anti-rotation got its own pattern (`core_rot`) so it can rotate
    // independently of the anti-extension slot, which stays `fixed`. A
    // user-adapted plan predates this and never gets new slots from the
    // template branch above, so backfill one directly — idempotent, since it
    // only fires when the day has no core_rot slot yet.
    if(d.kind==='gym' && Array.isArray(d.slots) &&
       !d.slots.some(sl=>{ const e=ex(sl.exercise_id); return e&&e.pattern==='core_rot'; })){
      d.slots.push({id:d.id+'_antirot', exercise_id:'pallof', sets:2, reps:[8,8], rpe:null, rest:45, role:'accessory'});
    }
  }
}

/* ================= BOOT ================= */
(async function boot(){
  try{
    const p=await kvGet('profile');
    if(!p){ S=seedState(); await save(); }
    else {
      S={}; for(const k of PERSIST_KEYS) S[k]=await kvGet(k);
      const seed=seedState();
      for(const k of PERSIST_KEYS) if(!S[k]) S[k]=seed[k];
      applyLibraryAndMigrate();
      await kvDel('exercises').catch(()=>{});   // drop any stale persisted library
      await save();                             // persist the migrated program + lib_version
    }
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(_){}
    render();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }catch(e){
    document.getElementById('view').innerHTML='<div class="card"><h3>Startup error</h3><pre>'+esc(e.message)+'</pre></div>';
  }
})();
</script>
